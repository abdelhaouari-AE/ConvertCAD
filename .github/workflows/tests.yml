# Runs the test-suite on every push and pull request (Windows + Linux).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen        # Qt without a screen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Linux system libraries (Qt runtime, build tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            build-essential xz-utils

      # DWG tests: Windows uses vendor/libredwg/win64 (in the repository);
      # Linux builds the converter once, then reuses it from the cache.
      - name: DWG converter (cache)
        if: runner.os == 'Linux'
        id: ldwg
        uses: actions/cache@v4
        with:
          path: vendor/libredwg/linux-x86_64
          key: libredwg-${{ matrix.os }}-${{ hashFiles('vendor/libredwg/patches/*', 'scripts/build_libredwg.sh') }}

      - name: DWG converter (build)
        if: runner.os == 'Linux' && steps.ldwg.outputs.cache-hit != 'true'
        run: bash scripts/build_libredwg.sh linux

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q
