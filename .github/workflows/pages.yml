# Publishes the website (folder site/) on GitHub Pages:
#   https://abdelhaouari-ae.github.io/ConvertCAD/
# Runs when site/ changes on main, or by hand (Actions tab > pages > Run workflow).
# Once, in the repository: Settings > Pages > Source: "GitHub Actions".
# The download buttons read the newest release from GitHub when the page opens,
# so a new release needs no change here.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # publish to GitHub Pages
  id-token: write       # proves the deployment comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
