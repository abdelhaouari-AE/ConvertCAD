# Builds every download of a ConvertCAD release:
#   Windows : portable zip + installer (setup.exe)
#   Linux   : portable tar.gz + AppImage + .deb
# Each one includes the DWG converter (GNU LibreDWG) and the OCR with its
# built-in model (English, French and the other Latin languages): users
# install nothing else. Other OCR languages are downloaded from the program
# (their files: workflow "OCR models release").
#
#  - manually: Actions tab > build > Run workflow. Tick "Publish the release"
#    to also create the GitHub release v<version> (version read from
#    convertcad/__init__.py) with the five files and the CHANGELOG notes.
#  - automatically when a version tag is pushed:  git tag v1.2.0 && git push --tags
#    (the release of that tag is created the same way)
#
# Code signing (Windows) by SignPath Foundation, see CODE_SIGNING.md.
# Active once these are set in the repository (Settings > Secrets and variables
# > Actions):
#   secret   SIGNPATH_API_TOKEN        API token of the SignPath CI user
#   variable SIGNPATH_ORGANIZATION_ID  SignPath organization ID
# Each signing request waits for a manual approval on signpath.io (two per
# release: the programs, then the installer built from them).
# Without them the programs are built unsigned.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release v<version> with the five files"
        type: boolean
        default: false

permissions:
  contents: write                       # needed to attach files to a release

# Same inputs -> same files: with a fixed hash seed and the commit time as
# build time, two builds of the same code are identical file by file, so an
# update downloads only the files that really changed (core/selfupdate.py).
env:
  PYTHONHASHSEED: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180                  # includes waiting for the signing approvals
    env:
      QT_QPA_PLATFORM: offscreen
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      # Python is pinned like the libraries (see CLAUDE.md, "Dependencies").
      # 3.12.10 is the last 3.12 release with Windows binaries.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (exact versions of requirements-lock.txt)
        run: |
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python scripts/check_lock.py

      - name: Build time = commit time (reproducible builds)
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: |
          python scripts/make_icon.py
          python -m PyInstaller --noconfirm --clean ConvertCAD.spec

      - name: Smoke test of the built program (PDF -> DWG with the bundled converter)
        shell: pwsh
        run: |
          python scripts/make_samples.py
          dist/ConvertCAD/ConvertCAD-cli.exe samples/sample_plan.pdf -o dist/check/sample.dwg -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("dist/check/sample.dwg")[0..5])
          if ($head -ne "AC1015") { Write-Error "not a DWG 2000 file: $head"; exit 1 }
          dist/ConvertCAD/ConvertCAD-cli.exe --list-ocr
          # the OCR really runs inside the built program (DLLs, built-in model)
          dist/ConvertCAD/ConvertCAD-cli.exe samples/sample_scan.pdf -o dist/check/scan.dxf -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path dist/check/scan_log.txt -Pattern "[1-9][0-9]* OCR text\(s\) \(PP-OCR" -Quiet)) {
            Write-Error "the OCR did not run in the built program"; exit 1 }
          Remove-Item dist/check -Recurse

      # ---- signing 1/2: ConvertCAD.exe and ConvertCAD-cli.exe (SignPath) ----
      - name: Upload the programs to sign
        id: unsigned_app
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-programs
          path: |
            dist/ConvertCAD/ConvertCAD.exe
            dist/ConvertCAD/ConvertCAD-cli.exe
          retention-days: 1

      - name: Sign the programs (approve the request on signpath.io)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ConvertCAD
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned_app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-programs

      - name: Put the signed programs back
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/signed-programs/ConvertCAD.exe, dist/signed-programs/ConvertCAD-cli.exe dist/ConvertCAD/ -Force
          # stop here if the signature is missing or invalid
          foreach ($f in "dist/ConvertCAD/ConvertCAD.exe", "dist/ConvertCAD/ConvertCAD-cli.exe") {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid") { Write-Error "$f is not signed: $($sig.Status)"; exit 1 }
          }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = python -c "import convertcad; print(convertcad.APP_VERSION)"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md, PRIVACY.md, CODE_SIGNING.md dist/ConvertCAD/
          # list of files with their checksums, for small updates: LAST,
          # once the folder is final (signed programs, documents)
          python scripts/make_manifest.py dist/ConvertCAD
          Compress-Archive -Path dist/ConvertCAD -DestinationPath "dist/ConvertCAD-$v-win64-portable.zip"

      - name: Per-file update test (files in use replaced, then checked)
        shell: pwsh
        run: python scripts/update_selftest.py dist/ConvertCAD (Get-ChildItem dist/ConvertCAD-*-win64-portable.zip).FullName

      - name: Installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          set CONVERTCAD_NOPAUSE=1
          call scripts\build_installer.bat

      # ---- signing 2/2: the installer (built from the signed programs) ----
      - name: Upload the installer to sign
        id: unsigned_setup
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer
          path: dist/ConvertCAD-*-win64-setup.exe
          retention-days: 1

      - name: Sign the installer (approve the request on signpath.io)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ConvertCAD
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-installer

      - name: Put the signed installer back
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/signed-installer/*.exe dist/ -Force
          $f = Get-ChildItem dist/ConvertCAD-*-win64-setup.exe
          $sig = Get-AuthenticodeSignature $f.FullName
          if ($sig.Status -ne "Valid") { Write-Error "installer not signed: $($sig.Status)"; exit 1 }

      - uses: actions/upload-artifact@v6
        with:
          name: ConvertCAD-windows
          path: |
            dist/ConvertCAD-*-win64-portable.zip
            dist/ConvertCAD-*-win64-setup.exe
          retention-days: 30

  linux:
    # Built on the oldest supported Ubuntu: the programs then run on newer
    # distributions too (glibc is backward compatible only).
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build time = commit time (reproducible builds)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: System libraries (Qt runtime, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 \
            build-essential xz-utils

      - name: DWG converter (cache)
        uses: actions/cache@v4
        with:
          path: vendor/libredwg/linux-x86_64
          key: libredwg-ubuntu22-${{ hashFiles('vendor/libredwg/patches/*', 'scripts/build_libredwg.sh') }}

      - name: Portable program (tests included)
        run: bash scripts/build_linux.sh

      - name: Per-file update test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/update_selftest.py dist/ConvertCAD

      - name: AppImage
        run: bash scripts/build_appimage.sh

      - name: Debian package
        run: bash scripts/build_deb.sh

      - name: Smoke test (AppImage -> DWG, package contents)
        run: |
          python scripts/make_samples.py
          ./dist/ConvertCAD-*-x86_64.AppImage --appimage-extract-and-run --cli \
              samples/sample_plan.pdf -o /tmp/check/sample.dwg -q
          test "$(head -c 6 /tmp/check/sample.dwg)" = "AC1015"
          ./dist/ConvertCAD-*-x86_64.AppImage --appimage-extract-and-run --cli \
              samples/sample_scan.pdf -o /tmp/check/scan.dxf -q
          grep -qE "[1-9][0-9]* OCR text\(s\) \(PP-OCR" /tmp/check/scan_log.txt
          dpkg-deb --info dist/convertcad_*_amd64.deb
          dpkg-deb --contents dist/convertcad_*_amd64.deb | grep -q libredwg/dxf2dwg

      - name: OCR model download from the built program (information only)
        continue-on-error: true
        env:
          CONVERTCAD_OCR_MODELS: /tmp/check/models
        run: |
          ./dist/ConvertCAD-*-x86_64.AppImage --appimage-extract-and-run --cli --get-ocr-model greek
          ./dist/ConvertCAD-*-x86_64.AppImage --appimage-extract-and-run --cli --list-ocr

      - uses: actions/upload-artifact@v6
        with:
          name: ConvertCAD-linux
          path: |
            dist/ConvertCAD-*-linux-x86_64.tar.gz
            dist/ConvertCAD-*-x86_64.AppImage
            dist/convertcad_*_amd64.deb
          retention-days: 30

  # One release, created once both builds have succeeded.
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version and release notes
        id: v
        run: |
          # version written in the program (APP_VERSION = "1.2.0")
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' convertcad/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="v$v"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # the CHANGELOG section of this version becomes the release notes
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "ConvertCAD $v" > notes.md

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ConvertCAD ${{ steps.v.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/ConvertCAD-*-win64-setup.exe
            dist/ConvertCAD-*-win64-portable.zip
            dist/ConvertCAD-*-x86_64.AppImage
            dist/convertcad_*_amd64.deb
            dist/ConvertCAD-*-linux-x86_64.tar.gz
